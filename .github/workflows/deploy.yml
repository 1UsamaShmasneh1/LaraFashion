{
  "name": "Deploy LaraFashion",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "run_id": {
          "required": true,
          "description": "Single approved transition RunId",
          "type": "string"
        },
        "commit": {
          "required": true,
          "description": "Exact validated full commit SHA",
          "type": "string"
        },
        "authorization_mode": {
          "required": true,
          "description": "Explicit UntilTransitionClosed authorization for this transition only",
          "type": "string"
        },
        "host_fingerprint": {
          "required": true,
          "description": "Independent Oracle host fingerprint",
          "type": "string"
        }
      }
    }
  },
  "concurrency": {
    "group": "larafashion-production",
    "cancel-in-progress": false
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Check out exact candidate",
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ github.sha }}",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Use target .NET SDK",
          "uses": "actions/setup-dotnet@v4",
          "with": {
            "dotnet-version": "9.0.203"
          }
        },
        {
          "name": "Validate workflow and Bash syntax",
          "run": "python3 -m json.tool .github/workflows/deploy.yml >/dev/null\nbash -n deploy/deploy-production.sh deploy/actions-ssh.sh deploy/actions-remote.sh deploy/actions-preflight.sh\nbash -n deploy/tests/run-harness.sh\npython3 -m py_compile deploy/tests/harness.py\npython3 -m py_compile deploy/first-transition.py\nsudo python3 deploy/tests/first-transition-tests.py\npython3 deploy/tests/ssh-transport.py"
        },
        {
          "name": "Test safe checkout with isolated local Git fixtures",
          "run": "python3 deploy/tests/recovery-safety.py"
        },
        {
          "name": "Restore pinned dependencies and tools",
          "run": "dotnet tool restore\ndotnet restore LaraFashion.IntegrationTests"
        },
        {
          "name": "Build and verify model",
          "env": {
            "LARAFASHION_EF_CONNECTION": "Data Source=${{ runner.temp }}/design-only.db;Mode=ReadWrite"
          },
          "run": "dotnet build LaraFashion.IntegrationTests -c Release --no-restore\ndotnet tool run dotnet-ef migrations has-pending-model-changes --project LaraFashion --configuration Release --no-build"
        },
        {
          "name": "Run actual SQLite regression runner",
          "run": "dotnet run --project LaraFashion.IntegrationTests -c Release --no-build"
        },
        {
          "name": "Publish isolated harness candidates",
          "run": "dotnet publish LaraFashion -c Release --no-build --no-restore -o \"$RUNNER_TEMP/app-drop\"\ndotnet publish LaraFashion.IntegrationTests -c Release --no-build --no-restore -o \"$RUNNER_TEMP/tool-drop\""
        },
        {
          "name": "Exercise Bash deployment failures with synthetic SQLite",
          "env": {
            "LARAFASHION_HARNESS_DOTNET": "dotnet",
            "LARAFASHION_HARNESS_TOOL": "${{ runner.temp }}/tool-drop/LaraFashion.IntegrationTests.dll",
            "LARAFASHION_HARNESS_TOOL_DROP": "${{ runner.temp }}/tool-drop",
            "LARAFASHION_HARNESS_APP_DROP": "${{ runner.temp }}/app-drop",
            "LARAFASHION_HARNESS_COMMIT": "${{ github.sha }}",
            "LARAFASHION_HARNESS_WORKERS": "1"
          },
          "run": "set -Eeuo pipefail\nexport LARAFASHION_HARNESS_DOTNET=\"$(readlink -f \"$(command -v dotnet)\")\"\nif ! id app >/dev/null 2>&1; then sudo useradd --uid 1654 --create-home --shell /usr/sbin/nologin app; fi\n[[ \"$(id -u app)\" == 1654 ]]\nsudo --preserve-env=LARAFASHION_HARNESS_DOTNET,LARAFASHION_HARNESS_TOOL,LARAFASHION_HARNESS_TOOL_DROP,LARAFASHION_HARNESS_APP_DROP,LARAFASHION_HARNESS_COMMIT,LARAFASHION_HARNESS_WORKERS bash deploy/tests/run-harness.sh"
        }
      ]
    },
    "deploy": {
      "needs": "validate",
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 240,
      "steps": [
        {
          "name": "Require exact SHA and explicit task authorization",
          "env": {
            "SSH_HOST_FINGERPRINT": "${{ inputs.host_fingerprint }}",
            "TRANSITION_RUN_ID": "${{ inputs.run_id }}",
            "DEPLOY_COMMIT": "${{ github.sha }}",
            "LARAFASHION_AUTHORIZATION_MODE": "${{ inputs.authorization_mode }}",
            "SSH_HOST": "82.70.208.68",
            "REQUESTED_COMMIT": "${{ inputs.commit }}"
          },
          "run": "set +x\nset -Eeuo pipefail\n[[ \"$DEPLOY_COMMIT\" =~ ^[0-9a-f]{40}$ && \"$REQUESTED_COMMIT\" == \"$DEPLOY_COMMIT\" ]]\n[[ \"$TRANSITION_RUN_ID\" =~ ^lf-cutover-[A-Za-z0-9-]+$ ]]\n[[ \"$LARAFASHION_AUTHORIZATION_MODE\" == UntilTransitionClosed ]]\n[[ \"$SSH_HOST\" == 82.70.208.68 ]]\n[[ \"$SSH_HOST_FINGERPRINT\" == SHA256:PY1p4k7jJ1WXl+Mz2ze1wUFQX9oEfM4YKsBAO6gRKws ]]"
        },
        {
          "name": "Check out verified transport",
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Deploy verified SHA through one deployment script",
          "env": {
            "LARAFASHION_FIRST_TRANSITION": "1",
            "LARAFASHION_AUTHORIZATION_MODE": "${{ inputs.authorization_mode }}",
            "SSH_HOST": "82.70.208.68",
            "DEPLOY_COMMIT": "${{ github.sha }}",
            "LARAFASHION_ACTION_RUN_ID": "${{ github.run_id }}",
            "LARAFASHION_TRANSITION_RUN_ID": "${{ inputs.run_id }}",
            "SSH_KEY": "${{ secrets.SSH_KEY }}",
            "SSH_HOST_FINGERPRINT": "${{ inputs.host_fingerprint }}"
          },
          "run": "bash deploy/actions-ssh.sh"
        }
      ],
      "if": "${{ github.event_name == 'workflow_dispatch' }}"
    }
  }
}
